# Planning Poker — dev API gateway.
#
# Implements the §14 contract from planning-poker-technical-spec.md:
#   - terminates client traffic, proxies /api and /socket.io to the Node backend
#   - overwrites X-Forwarded-For (does not append) so it cannot be spoofed
#   - forwards X-Forwarded-Proto so the backend emits Secure cookies under HTTPS
#   - injects X-Request-Id on every request (echoed back to the client)
#   - upgrades /socket.io WebSocket connections with a 1h read timeout
#   - declares per-IP rate-limit zones (coarse abuse floor; auth-aware limits
#     remain in the backend per §14.6)
#
# Backend reachability:
#   - In dev the Node process runs on the host (pnpm dev), so we proxy to
#     host.docker.internal:4000. The docker-compose service maps this to
#     the docker host gateway for cross-platform support.
#   - When the backend itself is dockerized later, swap the upstream target
#     for the service name (e.g. `backend:4000`) and drop extra_hosts.
#
# CORS is intentionally NOT handled here yet. Backend still owns it via the
# `cors()` middleware. Once you're ready to flip per §14.2, uncomment the
# add_header lines below and remove `app.use(cors(...))` from app.ts in the
# same change so headers don't double up.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rid=$request_id rt=$request_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Hardening defaults ───────────────────────────────────────────────
    server_tokens off;
    client_max_body_size 1m;       # planning-poker payloads are tiny
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ── WebSocket upgrade map ────────────────────────────────────────────
    # Used for both /socket.io (the app) and / (Vite HMR in dev).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate-limit zones (per-IP, abuse floor) ───────────────────────────
    # Auth-aware limits live in the backend per §14.6. These are the coarse
    # network-edge throttles that stop one IP from saturating the upstream.
    # Limits are intentionally generous for dev; tune down for production.
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=100r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;

    # ── Upstream ─────────────────────────────────────────────────────────
    upstream backend {
        # Single instance today. ip_hash becomes the sticky-session
        # mechanism once we run multiple Node instances; remove it once the
        # Socket.IO Redis adapter (§11.1) ships.
        server host.docker.internal:4000;
        # ip_hash;  # enable when scaling out, before the Redis adapter
        keepalive 32;
    }

    # Vite dev server runs on the host on 5173. Only used by the `/` location
    # below to proxy frontend assets + HMR through the gateway in dev.
    upstream frontend_dev {
        server host.docker.internal:5173;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # X-Request-Id: trust nginx-generated unless caller supplied a sane one.
        set $rid $request_id;
        if ($http_x_request_id ~* '^[A-Za-z0-9_-]{8,128}$') {
            set $rid $http_x_request_id;
        }

        # Echo to the client so devs can correlate logs.
        add_header X-Request-Id $rid always;

        # Connection-count cap per IP (anti-slowloris).
        limit_conn conn 50;

        # Gateway-local liveness probe. Distinct from the upstream's /health.
        location = /__nginx_health {
            access_log off;
            return 200 "ok\n";
        }

        # ── Auth surface: stricter throttle ──────────────────────────────
        # Login/register are the credential-stuffing target; tighter cap.
        # Bootstrap and refresh participate in the standard /api/ throttle and
        # get their 1.2× headroom on the backend rate limiter (§14.6).
        location ~ ^/api/auth/(login|register)(/|$) {
            limit_req zone=auth burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE — do not use $proxy_add_x_forwarded_for
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $rid;

            proxy_pass http://backend;
        }

        # ── REST API ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=200 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $rid;

            # Once gateway owns CORS, uncomment AND remove backend cors() in the same commit:
            # add_header Access-Control-Allow-Origin      $http_origin always;
            # add_header Access-Control-Allow-Credentials "true"       always;
            # add_header Access-Control-Allow-Methods     "GET, POST, PATCH, DELETE, OPTIONS" always;
            # add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Fingerprint, X-Request-Id" always;
            # if ($request_method = OPTIONS) { return 204; }

            proxy_pass http://backend;
        }

        # ── Socket.IO ────────────────────────────────────────────────────
        # No HTTP rate-limit here: per §14.6, the Socket.IO event-level
        # limiter in the backend governs message rate after upgrade.
        location /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $rid;

            # WS sessions stay open for the duration of a planning round.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            proxy_buffering off;

            proxy_pass http://backend;
        }

        # ── Frontend (Vite dev server, HMR-aware) ────────────────────────
        # In production this should be `root /usr/share/nginx/html;` after
        # `cd frontend && pnpm build`. The dev variant proxies to vite so
        # HMR (which uses its own WebSocket on the same origin) works.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;

            proxy_pass http://frontend_dev;
        }
    }
}
