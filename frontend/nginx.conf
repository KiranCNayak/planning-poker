server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path returns index.html so React Router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
