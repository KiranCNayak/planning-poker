name: release-please

# Maintains a "release PR" on every push to main that bumps the version in
# package.json and updates CHANGELOG.md based on conventional-commit history.
# Merging the release PR creates a vX.Y.Z tag, which triggers release.yaml.

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            # `token: RELEASE_PLEASE_TOKEN` (a classic PAT with repo + workflow
            # scopes) is required so the tag push fires `release.yaml`. Tags
            # pushed by the default GITHUB_TOKEN do not trigger downstream
            # workflows (recursive-loop prevention).
            - uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
