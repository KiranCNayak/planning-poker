services:
    postgres:
        image: postgres:16
        env_file: backend/.env
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    # API gateway. Opt-in: only starts with `--profile gateway`.
    # See infra/nginx/nginx.conf and §14 of planning-poker-technical-spec.md.
    nginx:
        image: nginx:1.27-alpine
        profiles: ["gateway"]
        ports:
            - "8080:80"
        volumes:
            - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        # `host.docker.internal:host-gateway` is the cross-platform way to
        # reach services running on the host (pnpm dev backend on :4000,
        # vite on :5173). Required on Linux; harmless on Docker Desktop.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost/__nginx_health"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    pg_data:
    redis_data:
